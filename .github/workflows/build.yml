name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: |
          ZIP=$(git log --diff-filter=AM --name-only --pretty=format: -- '*.zip' | grep . | head -n1)
          echo "Usando: $ZIP"
          unzip -q "$ZIP" -d src
          cd src/ramiel-beam
          chmod +x gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: ramiel-beam-jar
          path: src/ramiel-beam/build/libs/*.jar
